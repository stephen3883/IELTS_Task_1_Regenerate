<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task 1 Studio – IELTS Academic Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4fa; --surface:#ffffff; --surface2:#e9eef8; --ink:#14213d; --muted:#55627f; --line:#d3dbec; --grid:#d9e0ee;
  --accent:#2447d6; --hl:#ffe14d; --hl-ink:#14213d; --paper:#f7f9ff; --paper-line:#e1e7f4;
  --good:#16794f; --bad:#b92d22;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1323; --surface:#141d33; --surface2:#1a2540; --ink:#e9edf8; --muted:#a0abc8; --line:#2a3656; --grid:#26324f;
    --accent:#86a0ff; --paper:#0f1830; --paper-line:#18223d; --good:#4cc790; --bad:#ff7d70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1323; --surface:#141d33; --surface2:#1a2540; --ink:#e9edf8; --muted:#a0abc8; --line:#2a3656; --grid:#26324f;
  --accent:#86a0ff; --paper:#0f1830; --paper-line:#18223d; --good:#4cc790; --bad:#ff7d70; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-head);margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.shell{max-width:1360px;margin:0 auto;padding:18px clamp(12px,3vw,30px) 56px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;flex:none;border-radius:12px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center}
.brand h1{font-size:28px;line-height:1.05;font-weight:800}
.brand p{margin:3px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.top-actions{display:flex;gap:8px}

/* buttons */
.btn{padding:8px 13px;border-radius:9px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{background:var(--hl);color:var(--hl-ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--hl);color:var(--hl-ink)}
.btn.soft{border-color:var(--line)}
.btn.sm{padding:5px 9px;font-size:12px}
.chip{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;line-height:1.2}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
select.chip{padding-right:8px}

/* 12 options */
.opts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:11px 12px 10px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;min-width:0}
.opt svg{width:46px;height:31px;color:var(--muted);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt .ot{display:block}
.opt b{font:700 14px/1.2 var(--font-head);display:block}
.opt .sub{font-style:normal;font-size:12.5px;color:var(--muted);display:block;line-height:1.3;margin-top:1px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--hl);border-color:var(--ink);color:var(--hl-ink);box-shadow:3px 3px 0 var(--ink)}
.opt[aria-pressed="true"] svg,.opt[aria-pressed="true"] .sub{color:var(--hl-ink)}
@media (max-width:1180px){.opts{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.opts{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.opt{padding:9px}}
@media (max-width:480px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}}
.stagecard{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.stagehead h2{font-size:19px;line-height:1.3;font-weight:700}
.stagehead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;min-height:0}
.controls:empty{display:none}
.controls .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.stage{margin-top:10px;border-radius:12px;padding:12px;border:1px solid var(--line);min-height:300px;overflow:hidden;position:relative;
  background-color:var(--paper);
  background-image:linear-gradient(var(--paper-line) 1px,transparent 1px),linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);
  background-size:22px 22px}
.stage svg{display:block;max-width:100%;height:auto}
.empty{padding:70px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:10px;border:1.5px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend:empty{display:none}
.lg{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.lg i{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.lg[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.lg.on{border-color:var(--ink)}
.lg.static{cursor:default}
.hint{margin:10px 2px 0;color:var(--muted);font-size:13px}

/* svg bits */
.plotbg{fill:var(--surface)}
.grid{stroke:var(--grid);stroke-width:1;stroke-dasharray:3 4}
.axl{stroke:var(--muted);stroke-width:1.2}
.axt{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.axu{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--font-body)}
.cross{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3}
.ser,.bar,.slice,.shrow,tr[data-s],.seg{transition:opacity .15s}
.dim{opacity:.16}
tr.dim{opacity:.35}
.ln{fill:none;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.pt{stroke:var(--surface);stroke-width:2;transform-box:fill-box;transform-origin:center;transition:transform .1s}
.pt.hot{transform:scale(1.7)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.growY{transform-box:fill-box;transform-origin:50% 100%;animation:gy .55s ease-out both}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.growX{transform-box:fill-box;transform-origin:0 50%;animation:gx .55s ease-out both}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar.foc,.seg.foc{stroke:var(--ink);stroke-width:3}
.vl{font-size:11.5px;font-weight:700;fill:var(--ink);font-family:var(--font-body)}
.kp-ring{fill:none;stroke:var(--ink);stroke-width:2.5}
.kp-lab{font-size:12px;font-weight:800;fill:var(--hl-ink);paint-order:stroke;stroke:var(--hl);stroke-width:6px;stroke-linejoin:round;font-family:var(--font-body)}
.slice{cursor:pointer;transition:transform .15s,opacity .15s}
.slice:hover{transform:translate(var(--dx),var(--dy))}
.pl{font-size:12px;font-weight:800;pointer-events:none;font-family:var(--font-body)}
.pie-center{font:800 15px var(--font-head);fill:var(--ink)}
.pie-sub{font-size:11.5px;fill:var(--muted)}

/* pie layouts */
.pie-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.pie-wrap>svg{flex:none}
.shares{flex:1 1 230px;min-width:0;background:var(--surface);border-radius:10px;border:1px solid var(--line);padding:6px 10px;list-style:none;margin:0}
.shrow{display:grid;grid-template-columns:14px 1fr auto;gap:2px 9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shrow:last-child{border-bottom:0}
.shrow i{width:12px;height:12px;border-radius:3px}
.shrow b{font-size:14px}
.shrow .pc{font-weight:800;font-variant-numeric:tabular-nums}
.shrow .bartrack{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.shrow .bartrack div{height:100%;border-radius:3px}
.shrow small{grid-column:2 / 4;color:var(--muted);font-size:12px}
.pies{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.pies figure{margin:0;text-align:center;background:var(--surface);border-radius:12px;padding:8px 6px 10px;border:1px solid var(--line)}
.pies figcaption{font:700 14px var(--font-head)}

/* table view */
.tblwrap{overflow:auto;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt thead th{background:var(--surface2);font-weight:700}
table.dt tbody th{text-align:left;font-weight:700}
table.dt tbody tr:last-child>*{border-bottom:0}
table.dt td{background:color-mix(in srgb,var(--accent) calc(var(--h,0) * 50%),transparent)}
table.dt td.hi{background:var(--hl);color:var(--hl-ink);font-weight:800}
table.dt td.foc{outline:3px solid var(--ink);outline-offset:-3px}
table.dt .corner{text-align:left;color:var(--muted);font-weight:600}
.sortbtn{background:none;border:0;padding:0;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.sortbtn:hover{text-decoration:underline}
.sortbtn.sel{background:var(--hl);color:var(--hl-ink);padding:2px 7px;border-radius:6px}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.tp{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.tp>div:first-child{flex:1 1 320px;min-width:0}
.tp>div:last-child{flex:0 1 270px;margin:0 auto;text-align:center}
.tp .cap{font:700 14px var(--font-head);margin-bottom:4px}

/* maps */
.mapsvg{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.maplab rect{fill:var(--ink)}
.maplab text{fill:var(--bg);font-size:13px;font-weight:700;font-family:var(--font-body)}
.changed-o{fill:none;stroke:var(--ink);stroke-width:4}
.changed-i{fill:none;stroke:var(--hl);stroke-width:2}
.handle-line{stroke:#fff;stroke-width:3}
.handle-line2{stroke:var(--ink);stroke-width:5;opacity:.5}
.handle-dot{fill:var(--hl);stroke:var(--ink);stroke-width:2.5;cursor:ew-resize}
.maprow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.maprow figure{margin:0}
.maprow figcaption{font:700 14px var(--font-head);margin-bottom:6px}
.edit-cursor{cursor:crosshair}

/* process */
.pnode{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;cursor:pointer;transition:opacity .2s}
.pgroup{cursor:pointer;transition:opacity .2s}
.pgroup.active .pnode{fill:var(--hl);stroke-width:2.5}
.pgroup.future{opacity:.3}
.ptx{font-weight:700;font-size:14px;fill:var(--ink);font-family:var(--font-body)}
.pd{font-size:12.5px;fill:var(--muted);font-family:var(--font-body)}
.pgroup.active .ptx,.pgroup.active .pd{fill:var(--hl-ink)}
.pb{fill:var(--ink)}
.pbt{fill:var(--bg);font-size:12px;font-weight:800;font-family:var(--font-body)}
.pgroup.active .pb{fill:var(--hl-ink)}.pgroup.active .pbt{fill:var(--hl)}
.parrow{stroke:var(--muted);stroke-width:2;fill:none}
.ahp{fill:var(--muted)}
.cyc-title{font:800 16px var(--font-head);fill:var(--ink)}

/* tooltip & toast */
.tip{position:fixed;z-index:60;display:none;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;line-height:1.5;max-width:270px;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.tip .tm{opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:70}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.tabs{display:flex;background:var(--surface2);border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 6px 10px;border:0;background:none;font-weight:700;font-size:14px;color:var(--muted);border-bottom:4px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);border-bottom-color:var(--hl)}
.tabbody{padding:14px}
.tabbody h3{font-size:15px;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea,.field select,textarea.big{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.field input:focus,.field textarea:focus,textarea.big:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.gridwrap{overflow:auto;border:1.5px solid var(--line);border-radius:10px;max-height:340px}
table.edit{border-collapse:collapse;width:100%;font-size:13px}
table.edit td,table.edit th{border:1px solid var(--line);padding:0;min-width:70px;background:var(--surface)}
table.edit th.corner{background:var(--surface2);min-width:60px}
table.edit .cellbox{display:flex;align-items:center}
table.edit input{width:100%;min-width:0;border:0;background:transparent;padding:8px;font-variant-numeric:tabular-nums}
table.edit input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface2)}
table.edit .hdr,table.edit .rname{font-weight:700}
table.edit .rname{min-width:110px}
table.edit .x{flex:none;border:0;background:none;color:var(--muted);padding:4px 7px;font-size:15px;line-height:1}
table.edit .x:hover{color:var(--bad)}
.samples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.samples>span{font-size:13px;color:var(--muted)}
details{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0}
summary{cursor:pointer;font-weight:600;font-size:14px}
details textarea{margin-top:8px;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface)}
.draft{background:var(--surface2);border-left:5px solid var(--hl);padding:10px 12px;border-radius:0 10px 10px 0;margin:6px 0;line-height:1.6}
.kf{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px;margin-bottom:7px}
.kf:hover,.kf[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.kf b{display:block;font-size:14px}
.kf small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:1px}
.kf:hover small,.kf[aria-pressed="true"] small{color:inherit;opacity:.85}
.badge{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.badge.up{background:color-mix(in srgb,var(--good) 18%,transparent)}
.badge.down{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.mini{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pal{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px}
.pal i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(20,33,61,.25)}
.pal[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.pals{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.lang-group{margin-bottom:12px}
.lang-group h4{font:700 14px var(--font-head);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.phrase{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:13px}
.phrase:hover{background:var(--hl);color:var(--hl-ink);border-color:var(--ink)}
.prompt{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.timerrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.timer{font:800 24px var(--font-head);font-variant-numeric:tabular-nums;min-width:74px}
.timer.low{color:var(--bad)}
.wc{margin-left:auto;font-weight:700;font-size:14px}
textarea.big{min-height:230px;resize:vertical;line-height:1.6;width:100%}
.wcbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:6px 0 12px}
.wcbar div{height:100%;background:var(--hl);border-right:2px solid var(--ink);width:0;transition:width .2s}
.checks{list-style:none;padding:0;margin:0}
.checks li{margin:5px 0}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{margin-top:4px;accent-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){.row2{grid-template-columns:1fr}.brand h1{font-size:24px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.draw{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v20h20"/><path d="M8 18l5-6 4 3 6-8"/></svg>
      </div>
      <div>
        <h1>Task 1 Studio</h1>
        <p>Enter your own data, map or process. Choose one of 12 interactive views, find the key features, then write your report.</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn soft" data-act="theme" id="themeBtn">Dark mode</button>
      <button class="btn soft" data-act="resetAll">Start over</button>
    </div>
  </header>

  <section aria-label="Choose a view"><div class="opts" id="opts"></div></section>

  <main class="work">
    <section class="stagecard" aria-label="Interactive view">
      <div class="stagehead"><h2 id="figTitle"></h2><p id="figSub"></p></div>
      <div class="controls" id="controls"></div>
      <div class="stage" id="stage"></div>
      <div class="legend" id="legend"></div>
      <p class="hint" id="hint"></p>
    </section>
    <aside class="panel" aria-label="Tools">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-act="tab" data-tab="data">Data</button>
        <button class="tab" role="tab" data-act="tab" data-tab="insights">Insights</button>
        <button class="tab" role="tab" data-act="tab" data-tab="language">Language</button>
        <button class="tab" role="tab" data-act="tab" data-tab="write">Write</button>
      </div>
      <div class="tabbody" id="tabbody" role="tabpanel"></div>
    </aside>
  </main>

/* ============================================================

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function isNum(v){return typeof v==='number'&&isFinite(v);}
function fmt(v){if(!isNum(v))return '–';var r=Math.round(v*100)/100;return r.toLocaleString('en-US',{maximumFractionDigits:2});}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function lcFirst(s){return s&&s.length>1&&s[1]===s[1].toLowerCase()?s[0].toLowerCase()+s.slice(1):s;}
function joinList(a){if(a.length<=1)return a.join('');return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function colorOf(i){return PALETTE[i%PALETTE.length];}
function lum(hex){var n=parseInt(hex.slice(1),16);return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;}
function textOn(hex){return lum(hex)>0.6?'#14213d':'#ffffff';}
function toNum(s){if(s==null)return null;var t=String(s).replace(/[,\s%$€£]/g,'');if(t===''||t==='-'||t==='–')return null;var n=parseFloat(t);return isFinite(n)?n:null;}
function catLabel(j){return String(state.data.cats[j]==null?'':state.data.cats[j]);}
function sName(i){var s=state.data.series[i];return (s&&s.name)||('Series '+(i+1));}
function U(v){var u=(state.data.unit||'').trim();if(!isNum(v))return '–';return u==='%'?fmt(v)+'%':(u?fmt(v)+' '+u:fmt(v));}
function visSeries(){
  return state.data.series.map(function(s,i){return {i:i,name:sName(i),v:s.values.map(function(x){return isNum(x)?x:NaN;}),c:colorOf(i)};})
    .filter(function(s){return !state.hidden.has(s.i);});
}
function empty(m){return '<div class="empty">'+esc(m||'Nothing to show yet. Add data in the Data tab.')+'</div>';}

function niceNum(x,round){
  var exp=Math.floor(Math.log10(x)),f=x/Math.pow(10,exp),nf;
  if(round){nf=f<1.5?1:f<3?2:f<7?5:10;}else{nf=f<=1?1:f<=2?2:f<=5?5:10;}
  return nf*Math.pow(10,exp);
}
function niceScale(min,max,ticks){
  ticks=ticks||5;
  if(!isFinite(min)||!isFinite(max)){min=0;max=1;}
  if(min===max){if(min===0){max=1;}else{max=min>0?min*1.2:0;min=min>0?0:min*1.2;}}
  var range=niceNum(max-min,false),step=niceNum(range/(ticks-1),true);
  var nmin=Math.floor(min/step+1e-9)*step,nmax=Math.ceil(max/step-1e-9)*step,arr=[];
  for(var v=nmin;v<=nmax+step/2;v+=step)arr.push(+v.toFixed(10));
  return {min:nmin,max:nmax,step:step,ticks:arr};
}
function wrapText(text,maxChars,maxLines){
  var words=String(text).split(/\s+/).filter(Boolean),lines=[],cur='';
  words.forEach(function(w){
    if(!cur){cur=w;}else if((cur+' '+w).length<=maxChars){cur+=' '+w;}else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=trunc(lines[maxLines-1]+'…',maxChars);}
  return lines;
}
function fracPhrase(p){
  var T=[[100,'the whole'],[75,'three quarters'],[66.7,'two thirds'],[50,'half'],[33.3,'a third'],[25,'a quarter'],[20,'one in five'],[10,'one in ten'],[5,'one in twenty']];
  var best=null,bd=1e9;
  T.forEach(function(t){var d=Math.abs(p-t[0]);if(d<bd){bd=d;best=t;}});
  if(bd<=1.2)return 'almost exactly '+best[1];
  if(bd<=4.5){return (p>best[0]?'just over ':'just under ')+best[1];}
  if(p>50)return 'the majority';
  if(p<5)return 'a very small minority';
  if(p<15)return 'a small minority';
  return 'a minority';
}

function load(){
  try{
    var raw=localStorage.getItem(KEY);if(!raw)return;
    var o=JSON.parse(raw);

      state.data=o.data;normData();

function normData(){
  var d=state.data,n=d.cats.length;
  d.cats=d.cats.map(String);
  d.series.forEach(function(s){
    s.values=s.values.slice(0,n);
    while(s.values.length<n)s.values.push(null);
    s.values=s.values.map(function(v){return isNum(v)?v:null;});
  });
  state.pieCat=clamp(state.pieCat,0,Math.max(0,n-1));
  state.hidden=new Set(Array.from(state.hidden).filter(function(i){return i<d.series.length;}));
  state.lineSeries=state.lineSeries.filter(function(i){return i<d.series.length;});

/* ============================================================

   ============================================================ */
function scaleY(sc,m,H){return function(v){return m.t+(H-m.t-m.b)*(1-(v-sc.min)/(sc.max-sc.min));};}
function yFrame(W,H,m,sc,leftUnit){
  var y=scaleY(sc,m,H),o='<rect class="plotbg" x="'+m.l+'" y="'+m.t+'" width="'+(W-m.l-m.r)+'" height="'+(H-m.t-m.b)+'" rx="4"/>';

function xLabels(pos,labels,y,avail){
  var maxLen=Math.max(1,Math.max.apply(null,labels.map(function(l){return Math.min(l.length,14);})));
  var lw=maxLen*6.6+14,step=Math.max(1,Math.ceil(lw/(avail/Math.max(labels.length,1))));

/* ============================================================

var postRender=null;

function renderLine(W){

  var vals=[].concat.apply([],vs.map(function(s){return s.v;})).filter(isNum);
  if(!vals.length)return empty('Add some numbers in the Data tab.');
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  var zero=lo<=0||lo<0.6*hi,sc=niceScale(zero?Math.min(0,lo):lo,hi);
  var m={l:leftMargin(sc),r:22,t:d.unit?32:16,b:d.xLabel?60:42};
  var iw=W-m.l-m.r,pad=Math.min(26,iw/(n*2)),y=scaleY(sc,m,H);

    o+='<g class="ser" data-s="'+s.i+'"><path class="hit" d="'+p+'"/><path class="ln'+(anim?' draw':'')+'" pathLength="1" d="'+p+'" stroke="'+s.c+'"/>';
    pts.forEach(function(q,i){
      if(!q)return;
      o+='<circle class="pt" data-i="'+i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(n>14?2.5:4.2)+'" fill="'+s.c+'"/>';
      if(state.showVals&&n*vs.length<=40){o+='<text class="vl" x="'+q[0].toFixed(1)+'" y="'+(q[1]-9).toFixed(1)+'" text-anchor="middle">'+fmt(s.v[i])+'</text>';}
    });
    o+='</g>';
  });
  if(state.keyPts){
    var mx=null,mn=null;
    vs.forEach(function(s){s.v.forEach(function(v,i){

      if(!k[0])return;
      var cx=xs[k[0].i],cy=y(k[0].v),ty=k[1]==='Highest'?cy-16:cy+24;
      o+='<circle class="kp-ring" cx="'+cx+'" cy="'+cy+'" r="9"/><text class="kp-lab" x="'+clamp(cx,50,W-50)+'" y="'+ty+'" text-anchor="middle">'+k[1]+': '+U(k[0].v)+'</text>';
    });
  }
  if(state.focus){
    var fs=state.focus,sv=state.data.series[fs.s];
    if(sv&&isNum(sv.values[fs.i])&&!state.hidden.has(fs.s)){
      var fx=xs[fs.i],fy=y(sv.values[fs.i]);
      o+='<line class="cross" x1="'+fx+'" x2="'+fx+'" y1="'+fy+'" y2="'+y(Math.max(sc.min,0))+'"/><circle cx="'+fx+'" cy="'+fy+'" r="12" fill="var(--hl)" stroke="var(--ink)" stroke-width="2.5" opacity=".9"/><circle cx="'+fx+'" cy="'+fy+'" r="4.5" fill="'+colorOf(fs.s)+'"/>';
    }
  }
  o+='<line id="cross" class="cross" y1="'+m.t+'" y2="'+(H-m.b)+'" x1="0" x2="0" style="display:none"/></svg>';
  postRender=function(){

  var A=p(r,a0),B=p(r,a1);

  var C=p(ir,a1),D=p(ir,a0);
  return 'M'+A[0]+','+A[1]+'A'+r+','+r+' 0 '+lg+' 1 '+B[0]+','+B[1]+'L'+C[0]+','+C[1]+'A'+ir+','+ir+' 0 '+lg+' 0 '+D[0]+','+D[1]+'Z';
}
function sharesAt(ci){

    case 'p':o+='<circle cx="'+(x+s*.3).toFixed(1)+'" cy="'+(y+s*.34).toFixed(1)+'" r="'+R(.17)+'" fill="#4b8d44"/><circle cx="'+(x+s*.68).toFixed(1)+'" cy="'+(y+s*.66).toFixed(1)+'" r="'+R(.12)+'" fill="#fff"/><circle cx="'+(x+s*.7).toFixed(1)+'" cy="'+(y+s*.3).toFixed(1)+'" r="'+R(.07)+'" fill="#f4a3b8"/><circle cx="'+(x+s*.32).toFixed(1)+'" cy="'+(y+s*.74).toFixed(1)+'" r="'+R(.07)+'" fill="#fff"/>';break;

function tileSVG(g,r,c,s,ox,oy){

function tilesSVG(g,s,ox,oy){var o='';for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)o+=tileSVG(g,r,c,s,ox,oy);return o;}

}

function analyse(){
  var d=state.data,n=d.cats.length;
  var S=d.series.map(function(s,i){
    var v=s.values.map(function(x){return isNum(x)?x:NaN;}),idx=[];
    v.forEach(function(x,k){if(isNum(x))idx.push(k);});
    if(!idx.length)return null;
    var f=idx[0],l=idx[idx.length-1],mx=f,mn=f;
    idx.forEach(function(k){if(v[k]>v[mx])mx=k;if(v[k]<v[mn])mn=k;});
    var first=v[f],last=v[l],change=last-first,pct=first!==0?change/Math.abs(first)*100:null;
    var range=v[mx]-v[mn],mean=idx.reduce(function(a,k){return a+v[k];},0)/idx.length;
    var diffs=[];for(var q=1;q<idx.length;q++)diffs.push(v[idx[q]]-v[idx[q-1]]);
    var tol=range*0.03,ups=diffs.filter(function(x){return x>tol;}).length,downs=diffs.filter(function(x){return x<-tol;}).length,trend;
    if(idx.length<2)trend='single';
    else if(range<=Math.abs(mean)*0.05)trend='stable';
    else if(downs===0&&ups>0)trend='increase';
    else if(ups===0&&downs>0)trend='decrease';
    else if(ups>0&&downs>0)trend='fluctuate';
    else trend='stable';
    return {i:i,name:sName(i),v:v,f:f,l:l,first:first,last:last,max:v[mx],maxI:mx,min:v[mn],minI:mn,change:change,pct:pct,trend:trend,mean:mean};
  }).filter(Boolean);
  var hi=null,lo=null,rise=null,fall=null;
  S.forEach(function(s){
    if(!hi||s.max>hi.v)hi={v:s.max,s:s.i,i:s.maxI,name:s.name};
    if(!lo||s.min<lo.v)lo={v:s.min,s:s.i,i:s.minI,name:s.name};
    if(s.trend!=='single'){
      if(s.change>0&&(!rise||s.change>rise.change))rise=s;
      if(s.change<0&&(!fall||s.change<fall.change))fall=s;
    }
  });
  var cross=[];
  if(n>1)for(var a=0;a<S.length;a++)for(var b=a+1;b<S.length;b++){
    var A=S[a],B=S[b],d0=A.v[0]-B.v[0],d1=A.v[n-1]-B.v[n-1];
    if(isNum(d0)&&isNum(d1)&&d0*d1<0)cross.push({win:d1>0?A:B,lose:d1>0?B:A});
  }
  var res={S:S,hi:hi,lo:lo,rise:rise,fall:fall,cross:cross};
  res.overview=overviewText(res);
  return res;
}
function adverb(pct){
  var p=pct==null?60:Math.abs(pct);
  return p>=100?'dramatically':p>=50?'significantly':p>=20?'considerably':p>=8?'steadily':'slightly';
}
function seriesSentence(s){
  var c=catLabel,k=s.i,up=['rose','climbed','grew'],dn=['fell','declined','dropped'];
  if(s.trend==='increase')return s.name+' '+up[k%3]+' '+adverb(s.pct)+' from '+U(s.first)+' in '+c(s.f)+' to '+U(s.last)+' in '+c(s.l)+'.';
  if(s.trend==='decrease')return s.name+' '+dn[k%3]+' '+adverb(s.pct)+' from '+U(s.first)+' in '+c(s.f)+' to '+U(s.last)+' in '+c(s.l)+'.';
  if(s.trend==='fluctuate')return s.name+' fluctuated, peaking at '+U(s.max)+' in '+c(s.maxI)+' and reaching a low of '+U(s.min)+' in '+c(s.minI)+'.';
  if(s.trend==='stable')return s.name+' remained broadly stable at around '+U(s.mean)+'.';
  return s.name+' was '+U(s.first)+' in '+c(s.f)+'.';
}
function overviewText(A){
  var d=state.data,n=d.cats.length,S=A.S;if(!S.length)return '';
  var nounMap={line:'line graph',bar:'bar chart',barh:'bar chart',stack:'stacked bar chart',pie:'pie chart',pies:'pie charts',table:'table',mixed:'chart',tablepie:'table and pie chart'};
  var noun=nounMap[state.mode]||'chart',title=lcFirst(String(d.title||'the data').replace(/\.+$/,''));
  var intro='The '+noun+' illustrates '+title+'.';
  var ov='';
  if(n>1&&S.length>0){
    var grp={increase:[],decrease:[],fluctuate:[],stable:[]};
    S.forEach(function(s){if(grp[s.trend])grp[s.trend].push(s.name);});
    var parts=[];
    if(grp.increase.length)parts.push(joinList(grp.increase)+' rose');
    if(grp.decrease.length)parts.push(joinList(grp.decrease)+' fell');
    if(grp.fluctuate.length)parts.push(joinList(grp.fluctuate)+' fluctuated');
    if(grp.stable.length)parts.push(joinList(grp.stable)+' remained stable');
    if(parts.length===1&&S.length>2&&(grp.increase.length===S.length||grp.decrease.length===S.length)){
      ov='Overall, all '+S.length+' categories '+(grp.increase.length?'showed an upward':'showed a downward')+' trend between '+catLabel(0)+' and '+catLabel(n-1)+'.';
    }else if(parts.length){
      ov='Overall, '+parts.slice(0,-1).join(', ')+(parts.length>1?', while ':'')+parts[parts.length-1]+' over the period.';
    }
    var topFirst=S.slice().sort(function(a,b){return (b.v[0]||0)-(a.v[0]||0);})[0],topLast=S.slice().sort(function(a,b){return (b.v[n-1]||0)-(a.v[n-1]||0);})[0];
    if(S.length>1){
      if(topFirst.i===topLast.i)ov+=' '+topLast.name+' remained the highest throughout.';
      else ov+=' '+topLast.name+' ended the period with the highest figure.';
    }
  }else{
    var top=S.slice().sort(function(a,b){return b.first-a.first;})[0],bot=S.slice().sort(function(a,b){return a.first-b.first;})[0];
    ov='Overall, '+top.name+' had the highest figure ('+U(top.first)+'), while '+bot.name+' had the lowest ('+U(bot.first)+').';
  }
  return (intro+' '+ov).trim();
}

function parseSteps(text){
  return text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var i=l.indexOf(':');

function parsePaste(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim();});
  if(lines.length<2)return null;
  var delim=lines[0].indexOf('\t')>=0?'\t':(lines[0].indexOf(';')>=0&&lines[0].indexOf(',')<0)?';':',';
  var rows=lines.map(function(l){return l.split(delim).map(function(x){return x.trim().replace(/^"|"$/g,'');});});
  var cats=rows[0].slice(1);if(!cats.length)return null;
  return {xLabel:rows[0][0]||'',cats:cats,series:rows.slice(1).map(function(r,i){return {name:r[0]||('Series '+(i+1)),values:cats.map(function(_,j){return toNum(r[j+1]);})};})};
}

var playId=0;

function applyData(nd,keepTitle){

function getData(el){var o={};if(!el||!el.attributes)return o;for(var i=0;i<el.attributes.length;i++){var at=el.attributes[i];if(at.name.indexOf('data-')===0)o[at.name.slice(5)]=at.value;}return o;}
function act(a,el,e){
  var D=getData(el);
  switch(a){
    case 'theme':{
      var root=document.documentElement,cur=root.getAttribute('data-theme'),dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme',dark?'light':'dark');$('#themeBtn').textContent=dark?'Dark mode':'Light mode';save();render();return;
    }
    case 'resetAll':{
      if(!el.getAttribute('data-armed')){el.setAttribute('data-armed','1');el.textContent='Click again to confirm';setTimeout(function(){el.removeAttribute('data-armed');el.textContent='Start over';},3000);return;}
      try{localStorage.removeItem(KEY);}catch(x){}
      stopPlay();stopTimer();var th=document.documentElement.getAttribute('data-theme');state=defaultState();
      if(th)document.documentElement.setAttribute('data-theme',th);
      renderOptions();renderPanel();render();return;
    }
    case 'tab':state.tab=D.tab;renderPanel();return;
    case 'keyPts':case 'showVals':case 'stackPct':case 'heat':case 'delta':state[a]=!state[a];state.animate=false;render();return;
    case 'toggleLine':{
      var i=+D.i,k=state.lineSeries.indexOf(i);
      if(k>=0)state.lineSeries.splice(k,1);else state.lineSeries.push(i);
      render();return;
    }
    case 'pieStep':{stopPlay();var n=state.data.cats.length;state.pieCat=(state.pieCat+(+D.d)+n)%n;render();if(state.tab==='insights')renderPanel();return;}
    case 'piePlay':{if(state.playing){stopPlay();render();}else{state.pieCat=0;startPlay('pie');}return;}
    case 'pieCol':state.pieCat=+D.c;render();if(state.tab==='insights')renderPanel();return;
    case 'sort':{
      var c=+D.c;
      if(!state.sort||state.sort.col!==c)state.sort={col:c,dir:'desc'};
      else if(state.sort.dir==='desc')state.sort={col:c,dir:'asc'};
      else state.sort=null;
      render();return;
    }
    case 'sortClear':state.sort=null;render();return;
    case 'legend':{
      var li=+D.i;
      if(state.hidden.has(li))state.hidden.delete(li);else{
        if(state.hidden.size>=state.data.series.length-1){toast('Keep at least one series visible');return;}
        state.hidden.add(li);
      }
      if(state.lock===li)state.lock=null;
      state.animate=false;render();if(state.tab==='insights')renderPanel();return;
    }
    case 'focus':{
      var s=+D.s,i2=+D.i;
      if(isFocus(s,i2)){state.focus=null;state.lock=null;}else{state.focus={s:s,i:i2};state.lock=s;state.hidden.delete(s);}
      render();renderPanel();return;
    }
    case 'lock':{var s2=+D.s;state.lock=state.lock===s2?null:s2;state.focus=null;render();renderPanel();return;}
    case 'clearFocus':state.lock=null;state.focus=null;render();renderPanel();return;
    case 'mapView':state.mapView=D.v;state.animate=false;render();if(state.tab==='data')renderPanel();return;
    case 'mapTarget':state.mapEdit=D.t;state.mapView='edit';render();renderPanel();return;
    case 'brush':state.brush=D.ch;if(state.mapView!=='edit'){state.mapView='edit';render();}else{renderLegend();}renderPanel();return;
    case 'mapClear':{var gr=state.map[state.mapEdit];for(var r=0;r<ROWS;r++)for(var cc=0;cc<COLS;cc++)gr[r][cc]='g';state.mapView='edit';render();save();return;}
    case 'mapCopy':{var from=D.d==='ab'?'a':'b',to=D.d==='ab'?'b':'a';state.map[to]=state.map[from].map(function(r){return r.slice();});render();save();toast('Map copied');return;}
    case 'mapSample':{state.map={title:MAP_SAMPLE.title,labelA:MAP_SAMPLE.labelA,labelB:MAP_SAMPLE.labelB,a:gridFrom(MAP_SAMPLE.a),b:gridFrom(MAP_SAMPLE.b)};state.mapView='slider';state.mapSplit=.5;state.mapFocus=null;renderPanel();render();save();return;}
    case 'mapT':{state.mapFocus=state.mapFocus===D.k?null:D.k;if(state.mapFocus)state.mapView='changes';render();renderPanel();return;}
    case 'pGo':{stopPlay();var gi=+D.i;state.pStep=state.pStep===gi?-1:gi;render();if(state.tab==='insights')renderPanel();return;}
    case 'pPrev':{stopPlay();var np=state.process.steps.length;state.pStep=state.pStep<=0?np-1:state.pStep-1;render();if(state.tab==='insights')renderPanel();return;}
    case 'pNext':{stopPlay();var nn=state.process.steps.length;state.pStep=state.pStep>=nn-1?0:state.pStep+1;render();if(state.tab==='insights')renderPanel();return;}
    case 'pPlay':{if(state.playing){stopPlay();render();}else startPlay('process');return;}
    case 'pAll':stopPlay();state.pStep=-1;render();if(state.tab==='insights')renderPanel();return;
    case 'pSample':{var ps=PROCESS_SAMPLES[D.k];state.process={title:ps.title,steps:clone(ps.steps)};state.pStep=-1;stopPlay();if(MODE[state.mode].kind==='process')state.mode=ps.mode;state.animate=true;renderOptions();renderPanel();render();save();return;}
    case 'sample':applyData(clone(SAMPLES[D.k])); renderPanel();render();save();return;
    case 'addRow':{var d=state.data;d.series.push({name:'Series '+(d.series.length+1),values:d.cats.map(function(){return null;})});renderPanel();render();save();return;}
    case 'addCol':{var d2=state.data;d2.cats.push(String(d2.cats.length+1));d2.series.forEach(function(s){s.values.push(null);});renderPanel();render();save();return;}
    case 'delRow':{var d3=state.data;if(d3.series.length<=1){toast('Keep at least one series');return;}d3.series.splice(+D.r,1);state.hidden=new Set();state.lock=null;normData();renderPanel();render();save();return;}
    case 'delCol':{var d4=state.data;if(d4.cats.length<=1){toast('Keep at least one column');return;}var cj=+D.c;d4.cats.splice(cj,1);d4.series.forEach(function(s){s.values.splice(cj,1);});normData();renderPanel();render();save();return;}
    case 'transpose':{
      var d5=state.data,newCats=d5.series.map(function(s,i){return sName(i);});
      var ns=d5.cats.map(function(c,j){return {name:String(c),values:d5.series.map(function(s){return s.values[j];})};});
      applyData({title:d5.title,unit:d5.unit,xLabel:'',cats:newCats,series:ns});renderPanel();render();save();return;
    }
    case 'applyPaste':{
      var res=parsePaste($('#paste').value);
      if(!res||!res.series.length){toast('Need a heading row and at least one data row');return;}
      var cur=state.data;
      applyData({title:cur.title,unit:cur.unit,xLabel:res.xLabel||cur.xLabel,cats:res.cats,series:res.series});
      renderPanel();render();save();toast('Data updated');return;
    }
    case 'copy':copyText(D.text||'');return;
    case 'copyWriting':copyText(state.writing);return;
    case 'timerToggle':{
      if(state.timer.running){stopTimer();el.textContent='Start';}
      else{if(state.timer.left<=0)state.timer.left=1200;state.timer.running=true;timerId=setInterval(timerTick,1000);el.textContent='Pause';}
      return;
    }
    case 'timerReset':{stopTimer();state.timer.left=1200;renderPanel();return;}
  }
}

/* ============================================================
   Wiring
   ============================================================ */
function wire(){
  tipEl=$('#tip');toastEl=$('#toast');
  document.addEventListener('click',function(e){
    var mo=e.target.closest('[data-mode]');
    if(mo){setMode(mo.getAttribute('data-mode'));return;}
    var el=e.target.closest('[data-act]');
    if(el){act(el.getAttribute('data-act'),el,e);return;}
    // lock a series by clicking a chart element
    var st=e.target.closest('#stage [data-s]');
    if(st){var s=+st.getAttribute('data-s');state.lock=state.lock===s?null:s;state.focus=null;applyHighlight();}
  });
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('g.pgroup')){e.preventDefault();act('pGo',e.target.closest('g.pgroup'),e);}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.matches('select[data-bind="pieCat"]')){stopPlay();state.pieCat=+t.value;render();if(state.tab==='insights')renderPanel();}
    else if(t.matches('select[data-bind="hiMode"]')){state.hiMode=t.value;render();}
    else if(t.matches('input[data-check]')){state.checks[t.getAttribute('data-check')]=t.checked;}
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.matches('input[data-f]')){
      var f=t.getAttribute('data-f');
      if(f==='title'||f==='unit'||f==='xLabel')state.data[f]=t.value;
      else if(f==='mtitle')state.map.title=t.value;
      else if(f==='labelA')state.map.labelA=t.value;
      else if(f==='labelB')state.map.labelB=t.value;
      else if(f==='ptitle')state.process.title=t.value;
      softRender();
    }else if(t.matches('input[data-kind]')){
      var k=t.getAttribute('data-kind'),d=state.data;
      if(k==='cat'){d.cats[+t.getAttribute('data-c')]=t.value;}
      else if(k==='name'){d.series[+t.getAttribute('data-r')].name=t.value;}
      else if(k==='val'){d.series[+t.getAttribute('data-r')].values[+t.getAttribute('data-c')]=toNum(t.value);}
      state.animate=false;softRender();
    }else if(t.id==='pSteps'){state.process.steps=parseSteps(t.value);state.pStep=Math.min(state.pStep,state.process.steps.length-1);softRender();}
    else if(t.id==='writing'){
      state.writing=t.value;var wc=wordCount(t.value);
      $('#wc').textContent=wc+' words';$('#wcfill').style.width=Math.min(100,wc/150*100)+'%';save();
    }else if(t.id==='pctIn'){
      var v=parseFloat(t.value.replace('%',''));
      $('#pctOut').textContent=isFinite(v)?(v<0||v>100?'Use a number from 0 to 100.':fmt(v)+'% is '+fracPhrase(v)+'. You can also say “'+(v>=50?'around ':'about ')+Math.round(v)+' per cent”.'):'Type a number to see how to say it.';
    }
  });
  // hover highlighting on the stage
  var stage=$('#stage');
  stage.addEventListener('pointerover',function(e){
    var el=e.target.closest('[data-s]'),v=el?+el.getAttribute('data-s'):null;
    if(v!==state.hover){state.hover=v;applyHighlight();}
  });
  stage.addEventListener('pointermove',function(e){
    var el=e.target.closest('[data-t]');
    if(el)showTip(tips[+el.getAttribute('data-t')]||'',e);
    else if(!e.target.closest('svg.line'))hideTip();
  });
  stage.addEventListener('pointerleave',function(){state.hover=null;applyHighlight();hideTip();});
  var lg=$('#legend');
  lg.addEventListener('pointerover',function(e){
    var el=e.target.closest('.lg[data-i]');
    if(MODE[state.mode].kind!=='data')return;
    var v=el?+el.getAttribute('data-i'):null;if(v!==state.hover){state.hover=v;applyHighlight();}
  });
  lg.addEventListener('pointerleave',function(){state.hover=null;applyHighlight();});
  if(window.ResizeObserver){
    var rt=0;new ResizeObserver(function(){
      var w=stageWidth();if(Math.abs(w-lastW)<2)return;
      clearTimeout(rt);rt=setTimeout(function(){state.animate=false;render();},120);
    }).observe(stage);
  }else window.addEventListener('resize',function(){state.animate=false;render();});
}

/* init */
load();
wire();
renderOptions();
renderPanel();
render();
var th=document.documentElement.getAttribute('data-theme');
if(th)$('#themeBtn').textContent=th==='dark'?'Light mode':'Dark mode';
else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)$('#themeBtn').textContent='Light mode';
})();
</script>
</body>
</html>
